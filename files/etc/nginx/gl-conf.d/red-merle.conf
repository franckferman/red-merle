# red-merle: serve the GL-native dashboard at /redmerle/
#
# The GL panel sets a global `index gl_home.html;`, so a request for the
# directory /redmerle/ looks for a gl_home.html that does not exist there and,
# with autoindex off, nginx answers 403 Forbidden. Point this prefix at our own
# index.html instead.
#
# access_by_lua_file mirrors what `location /` does in gl-conf.d/access.conf
# (the http->https redirect); a prefix location this specific would otherwise
# bypass it.
location /redmerle/ {
    index index.html;
    access_by_lua_file /usr/share/gl-ngx/oui-access.lua;
}

# LuCI posts its ubus calls to /ubus, but the stock GL configuration only
# proxies /ubus/ with a trailing slash. The exact path therefore falls through
# to a 301, the redirect drops the POST body, and every ubus call a LuCI page
# makes comes back empty — which is why the LuCI dashboard showed "unknown" for
# every field while the CGI-backed page worked. An exact-match location takes
# priority over the prefix one and fixes it without touching GL's own file.
# This is not red-merle specific: any LuCI app using ubus is affected.
location = /ubus {
    proxy_pass http://127.0.0.1:8080;
}
